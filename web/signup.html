<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account</title>
<link rel="stylesheet" href="app.css">
<script>try { var t = localStorage.getItem('g4s-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main class="authpage">
  <form class="authcard" id="f" novalidate>
    <div class="brand"><span class="vbadge">G4S</span><b>Route audit</b></div>
    <h1>Create a new account</h1>
    <p class="lead">The admin reviews every new account. You can sign in once it is approved.</p>
    <div class="msg" hidden></div>
    <label class="field"><span>Full name</span><input name="name" autocomplete="name" required></label>
    <label class="field"><span>Company</span><input name="company" autocomplete="organization" required></label>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
    <label class="field"><span>Phone (optional)</span><input name="phone" type="tel" autocomplete="tel"></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="new-password" required minlength="10">
      <small>At least 10 characters, with letters and numbers or symbols.</small></label>
    <label class="field"><span>Confirm password</span><input name="confirm" type="password" autocomplete="new-password" required></label>
    <button class="primary" type="submit">Create account</button>
    <p class="alt">Already have an account? <a href="/login">Sign in</a></p>
  </form>
</main>
<script src="auth.js"></script>
<script>
  onSubmit($('#f'), async (v, msg) => {
    if (v.password !== v.confirm) { showMsg(msg, 'err', 'The two passwords are not the same.'); return; }
    await post('/auth/signup', v);
    location.href = '/login?created=1';
  });
</script>
</body>
</html>
